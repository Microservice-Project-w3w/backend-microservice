server.port=8083

spring.application.name=inventory-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.issuer=${JWT_ISSUER:identity-service}
security.jwt.secret-base64=${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

app.security.public-paths[0]=/health
app.security.public-paths[1]=/actuator/health
app.security.public-paths[2]=/actuator/info
