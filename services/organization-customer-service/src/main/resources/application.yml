server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: organization-customer-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/organization_customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

security:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

app:
  security:
    public-paths:
      - /health
      - /actuator/health
      - /actuator/info
