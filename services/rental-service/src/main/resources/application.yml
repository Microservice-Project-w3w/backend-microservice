server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: rental-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

app:
  security:
    public-paths:
      - /health
      - /actuator/health
      - /actuator/info
  integration:
    inventory-base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
