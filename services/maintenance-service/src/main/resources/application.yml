server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: maintenance-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/maintenance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

  rental:
    base-url: ${RENTAL_SERVICE_URL:http://localhost:8084}