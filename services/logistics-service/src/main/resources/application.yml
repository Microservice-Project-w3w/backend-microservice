server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: logistics-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/logistics_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

app:
  security:
    public-paths:
      - /health
      - /actuator/health
      - /actuator/info
