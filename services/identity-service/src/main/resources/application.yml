server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}


  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckp3dDIwMjQhISE=}

app:
  auth:
    expose-verification-code: ${AUTH_EXPOSE_VERIFICATION_CODE:true}
